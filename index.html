<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Δυναμική Εφαρμογή Τέχνης</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Ανακάλυψε την Τέχνη</h1>
    <p> Κλίκαρε τα έργα που σε εμπνέουν περισσότερο.</p>
    
    <div class="gallery">

      <figure class="art gan">

          <img src="./images/GAN_Becoming_Blue.jpeg" alt="Becoming Blue">

        <figcaption>Becoming Blue</figcaption>
      </figure>

      <figure class="art gan">
          <a href="https://www.artaigallery.com/collections/all-items/products/walking-dead"
       target="_blank"
       rel="noopener noreferrer">
          <img src="./images/GAN_Walking_Dead.jpg" alt="GAN_Walking_Dead">
        </a>    
        <figcaption>Walking Dead</figcaption>
      </figure>

      <figure class="art gan">
        <a href="https://www.christies.com/en/lot/lot-6166184"
       target="_blank"
       rel="noopener noreferrer">
         <img src="./images/GAN_Edmond_de_Belamy.png" alt="GAN_Edmond_de_Belamy">
        </a>
        <figcaption>Edmond de Belamy</figcaption>
      </figure>

      <figure class="art gan">
        <a href="https://cyberneticforests.substack.com/p/what-was-the-gan"
       target="_blank"
       rel="noopener noreferrer">
          <img src="./images/GAN_folwers_dancers01.png" alt="GAN_folwers_dancers01">
         </a> 
        <figcaption>Flowers and Dancers</figcaption>
      </figure>

      <figure class="art gan">
         <a href="https://cyberneticforests.substack.com/p/what-was-the-gan"
       target="_blank"
       rel="noopener noreferrer">
          <img src="./images/GAN_folwers_dancers02.jpeg" alt="GAN_folwers_dancers02">
        </a>  
        <figcaption>Flowers and Dancers</figcaption>
      </figure>

      <figure class="art gan">
         <a href="https://cyberneticforests.substack.com/p/what-was-the-gan"
       target="_blank"
       rel="noopener noreferrer">
          <img src="./images/GAN_folwers_dancers03.jpeg" alt="GAN_folwers_dancers03">
        </a>
        <figcaption>Flowers and Dancers</figcaption>
      </figure>

      <figure class="art gan">
         <a href="https://www.artaigallery.com/collections/all-items/products/samual-adams"
       target="_blank"
       rel="noopener noreferrer">
          <img src="./images/GAN_samual-adams.jpeg" alt="GAN_samual-adams">
         </a>
         <figcaption>Samual Adams</figcaption>
      </figure>

      <!-- NET έργα -->
      <figure class="art NET">
          <a href="https://www.artsy.net/artwork/sara-ludy-transom"
       target="_blank"
       rel="noopener noreferrer">
            <img src="./images/NET_Transom.png" alt="Transom">
          </a>     
          <figcaption>Transom 
            <span class="ai-message"></span>
          </figcaption>
      </figure>

      <figure class="art NET">
        <a href="https://www.artsy.net/artwork/mark-napier-net-dot-flag-the-first-year"
       target="_blank"
       rel="noopener noreferrer">
          <img src="./images/NET_Flag.png" alt="Flag">
        </a>
        <figcaption>
          flag: the first year, 2012
          <span class="ai-message"></span>
        </figcaption>
      </figure>
    </div>


    <button id="generateArt" style="margin-top: 40px;">Δημιούργησε το δικό μου έργο</button>
    <canvas id="artCanvas" width="800" height="600" style="margin-top: 20px;"></canvas>

    <button id="showData" style="margin-top: 40px;">Δείξε μου τα δεδομένα</button>
    <pre id="debugOutput" style="
      background: #f0f0f0;
      padding: 20px;
      white-space: pre-wrap;
      border-radius: 8px;
      margin-top: 20px;
    "></pre>

  </div>

  <script src="script.js"></script>
</body>
</html>
