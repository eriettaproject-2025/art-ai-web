<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">

  <title>Δυναμική Εφαρμογή Τέχνης</title>
  <link rel="stylesheet" href="style.css">

<body>
  <div class="container">
    <h1>Ανακάλυψε την Τέχνη</h1>
    <p> Κλίκαρε τα έργα που σε εμπνέουν περισσότερο.</p>
    
    <div class="gallery space">

       <!-- CENTRAL EYE (ADD THIS) -->
      <div class="eye">
        <div class="pupil"></div>
      </div>

      <div class="eye-ai-message" id="eyeAI"></div>

          <a href="https://www.artaigallery.com/collections/all-items/products/walking-dead"

      <figure class="art gan">
         <a href="https://annaridler.com/gans-in-art"
       target="_blank"
       rel="noopener noreferrer">
          <img src="./images/GAN_Fall_of_House.png" alt="Fall of House">

          <img src="./images/GAN_Generational_Strength.png" alt="Generational Strength">

    <button id="showData" style="margin-top: 40px;">Δείξε μου τα δεδομένα</button>
    <pre id="debugOutput" style="
      background: #f0f0f0;
      padding: 20px;
      white-space: pre-wrap;
      border-radius: 8px;
      margin-top: 20px;
    "></pre>

  <script src="script.js"></script>
