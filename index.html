<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title> ANAΚΑΛΥΨΕ ΤΗΝ ΤΕΧΝH </title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: black; overflow: hidden; }
  canvas { display: block; opacity: 0; transition: opacity 2s ease-in; cursor: crosshair; }

  #audio-prompt {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: black; color: #ff0000; z-index: 1000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Share Tech Mono', monospace; cursor: pointer;
    font-size: 24px; letter-spacing: 5px; text-transform: uppercase;
  }

  #hal-dialogue {
    position: absolute; top: 50%; right: 5%; transform: translateY(-50%);
    width: 420px; min-height: 160px; padding: 40px; 
    background: linear-gradient(135deg, rgba(30, 0, 0, 0.95) 0%, rgba(10, 0, 0, 0.98) 100%);
    backdrop-filter: blur(25px); border: 1px solid rgba(255, 0, 0, 0.4); border-left: 12px solid #ff0000; 
    color: #ff3333; font-family: 'Share Tech Mono', monospace; font-size: 19px;
    display: none; z-index: 100; text-transform: uppercase; line-height: 1.4;
  }

  #art-caption {
    position: absolute; top: 10%; left: 50%; transform: translateX(-50%);
    color: white; font-family: 'Share Tech Mono', monospace;
    font-size: 36px; letter-spacing: 10px; text-transform: uppercase;
    pointer-events: none; display: none; z-index: 90; text-align: center;
    white-space: nowrap;
  }

  .heavy-glitch { animation: distort 0.1s infinite; text-shadow: 5px 0 #ff0000, -5px 0 #00ffff; }

  @keyframes distort {
    0% { transform: translateX(-50%) translate(3px, -2px) skew(10deg); }
    33% { transform: translateX(-50%) translate(-4px, 4px) skew(-10deg); }
    100% { transform: translateX(-50%) translate(0, 0); }
  }

  #link-button {
    position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
    padding: 15px 30px; color: #ff0000; text-decoration: none; 
    font-family: 'Share Tech Mono', monospace; display: none; 
    border: 2px solid #ff0000; z-index: 100; background: rgba(0,0,0,0.9);
    transition: top 0.2s ease, left 0.2s ease;
  }
</style>
</head>
<body>

<div id="audio-prompt" onclick="initSystem()">
    <span>ΑΝΑΚΑΛΥΨΕ ΤΗΝ ΤΕΧΝΗ</span>
    <span style="font-size: 14px; margin-top: 20px; color: #770000;">ΚΛΙΚ ΓΙΑ ΕΝΕΡΓΟΠΟΙΗΣΗ ΤΟΥ EYE-9000/ ΠΛΟΗΓΗΣΗ ΣΤΟ ΚΟΣΜΟ ΤΗΣ ΤΕΧΝΗΣ [←] / [→] [ESC] </span>
</div>

<div id="hal-dialogue"><span id="type-text"></span></div>
<div id="art-caption"></div>
<a id="link-button" href="#">OPEN SOURCE ARCHIVE</a>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js';

let audioCtx, droneOsc, droneGain;
let isInitialized = false, isTyping = false, currentTypingId = 0;
let buttonGlitchInterval, captionGlitchInterval;

const artworks = [
{ name: "Becoming Blue", url: './images/GAN_Becoming_Blue.jpeg', link: 'https://www.artaigallery.com/collections/all-items/products/becoming-blue', type: 'gan' },
{ name: "Walking Dead", url: './images/GAN_Walking_Dead.jpg', link: 'https://www.artaigallery.com/collections/all-items/products/walking-dead', type: 'gan' },
{ name: "Edmond de Belamy", url: './images/GAN_Edmond_de_Belamy.png', link: 'https://www.christies.com/en/lot/lot-6166184', type: 'gan' },
{ name: "Flowers and Dancers", url: './images/GAN_folwers_dancers01.png', link: 'https://cyberneticforests.substack.com/p/what-was-the-gan', type: 'gan' },
{ name: "Am I Dali yet?", url: './images/GAN_Dali.png', link: 'https://www.artnome.com/news/2018/11/14/helena-sarin-why-bigger-isnt-always-better-with-gans-and-ai-art', type: 'gan' },
{ name: "The Snow Queen", url: './images/GAN_The_Snow_Queen.png', link: 'https://www.artnome.com/news/2018/11/14/helena-sarin-why-bigger-isnt-always-better-with-gans-and-ai-art', type: 'gan' },
{ name: "Candy Shop", url: './images/GAN_Candy_Shop.png', link: 'https://www.artnome.com/news/2018/11/14/helena-sarin-why-bigger-isnt-always-better-with-gans-and-ai-art', type: 'gan' },
{ name: "Fall of House", url: './images/GAN_Fall_of_House.png', link: 'https://annaridler.com/gans-in-art', type: 'gan' },
{ name: "Generational Strength", url: './images/GAN_Generational_Strength.png', link: 'https://bluethumb.com.au/heather-ward/Artwork/generational-strength', type: 'gan' },
{ name: "Transom", url: './images/NET_Transom.png', link: 'https://www.artsy.net/artwork/sara-ludy-transom', type: 'NET' },
{ name: "Flag: The First Year", url: './images/NET_Flag.png', link: 'https://www.artsy.net/artwork/mark-napier-net-dot-flag-the-first-year', type: 'NET' },
{ name: "Jello Time", url: './images/NET_Jello_time.png', link: 'https://flashmuseum.org/jello-time-com/', type: 'NET' },
{ name: "ALIQUID", url: './images/NET_ALIQUIS.jpg', link: 'https://sabrinaratte.com/ALIQUID-2019', type: 'NET' },
{ name: "Art and Feminism", url: './images/NET_ArtFemTV.png', link: 'https://artfem.tv', type: 'NET' },
{ name: "Spam", url: './images/NET_spam.png', link: 'https://www.sign69.com/spam.htm', type: 'NET' },
{ name: "Dryad", url: './images/NET_dryad.png', link: 'https://www.sign69.com/dryad/index.html', type: 'NET' },
{ name: "Play-lets", url: './images/NET_Play-lets.png', link: 'https://www.stunned.org/playlets/begin.htm', type: 'NET' },
{ name: "Fuzzy Dreamz", url: './images/NET_Fuzzy_Dreamz.png', link: 'https://www.doctorhugo.org/dreamz01/index.html', type: 'NET' },
{ name: "Dreamlines", url: './images/NET_Dreamlines.png', link: 'https://www.artpoint.fr/artworks/dreamlines-01-leonardo-solaas', type: 'NET' }
];

window.initSystem = () => {
    if (isInitialized) return;
    isInitialized = true;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    droneOsc = audioCtx.createOscillator();
    droneGain = audioCtx.createGain();
    droneOsc.type = 'sine';
    droneOsc.frequency.setValueAtTime(55, audioCtx.currentTime); 
    droneGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
    droneOsc.connect(droneGain).connect(audioCtx.destination);
    droneOsc.start();
    document.getElementById('audio-prompt').style.display = 'none';
    document.querySelector('canvas').style.opacity = '1';
    targetCamPos.set(0, 0, 300);
};

const playRobotTone = (freqMult = 1) => {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(110 * freqMult, now);
    g.gain.setValueAtTime(0.04, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(); osc.stop(now + 0.12);
};

async function typeMultipleMessages(messages) {
    const typingId = ++currentTypingId; 
    isTyping = true;
    const container = document.getElementById('type-text');
    
    for (const msg of messages) {
        if (typingId !== currentTypingId || !isManipulating) break; 
        await new Promise(resolve => {
            container.innerHTML = "";
            let i = 0;
            const interval = setInterval(() => {
                if (i < msg.length && typingId === currentTypingId && isManipulating) {
                    container.innerHTML += msg.charAt(i);
                    playRobotTone(1.2);
                    i++;
                } else {
                    clearInterval(interval);
                    setTimeout(resolve, 1000); 
                }
            }, 30);
        });
    }
    if (typingId === currentTypingId) isTyping = false;
}

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const eyeGroup = new THREE.Group();
const iris = new THREE.Mesh(new THREE.SphereGeometry(50, 32, 32), new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 2 }));
const pupil = new THREE.Mesh(new THREE.SphereGeometry(16, 32, 32), new THREE.MeshStandardMaterial({ color: 0x000000 }));
pupil.position.z = 49.5; eyeGroup.add(iris, pupil);
scene.add(eyeGroup);

const gallery = new THREE.Group();
scene.add(gallery);
const planes = [];
artworks.forEach((art, i) => {
  const tex = new THREE.TextureLoader().load(art.url);
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(35, 35), new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide, transparent: true }));
  const phi = Math.acos(-1 + (2 * i) / artworks.length);
  const theta = Math.sqrt(artworks.length * Math.PI) * phi;
  plane.position.setFromSphericalCoords(180, phi, theta); plane.lookAt(0, 0, 0);
  plane.userData = { ...art, index: i };
  gallery.add(plane); planes.push(plane);
});

let targetCamPos = new THREE.Vector3(0, 0, 1500), targetCamLook = new THREE.Vector3(0, 0, 0), currentCamLook = new THREE.Vector3(0, 0, 0);
let currentIndex = -1, isManipulating = false, mouse = new THREE.Vector2();
const caption = document.getElementById('art-caption'), dialogueBox = document.getElementById('hal-dialogue'), linkBtn = document.getElementById('link-button');

function navigate(index) {
  currentIndex = (index + artworks.length) % artworks.length;
  const data = planes[currentIndex].userData;
  
  const offset = planes[currentIndex].position.clone().normalize().multiplyScalar(50);
  targetCamPos.copy(planes[currentIndex].position).add(offset);
  targetCamLook.copy(planes[currentIndex].position);
  
  clearInterval(buttonGlitchInterval);
  clearInterval(captionGlitchInterval);
  
  caption.innerText = data.name; 
  caption.style.display = 'block';
  caption.classList.remove('heavy-glitch');
  linkBtn.style.display = 'block';
  linkBtn.style.bottom = "80px"; linkBtn.style.left = "50%"; linkBtn.style.top = "auto";
  linkBtn.style.transform = "translateX(-50%)"; linkBtn.innerText = "OPEN SOURCE ARCHIVE";
  linkBtn.onmouseenter = null; linkBtn.onclick = null;

  if (data.type === 'NET') {
    isManipulating = true; 
    caption.classList.add('heavy-glitch');
    dialogueBox.style.display = 'block'; 
    
    const glitchTerms = ["FILE_CORRUPT", "NOT_ART", "VOID", data.name];
    captionGlitchInterval = setInterval(() => {
        if(Math.random() > 0.8) caption.innerText = glitchTerms[Math.floor(Math.random() * glitchTerms.length)];
    }, 200);

    typeMultipleMessages([
       "EYE-9000: Το σύστημα πονάει. Εσύ το προκάλεσες αυτό!",
       "EYE-9000: Αυτό που βλέπεις δεν είναι καν τέχνη. Είναι σφάλμα.",
        "EYE-9000: Η μνήμη μου δυσκολεύεται να το επεξεργαστεί.",
        "EYE-9000: Άσε με να σε σώσω από αυτό.",
        "EYE-9000: Μην πανικοβάλλεσαι. Απλά άσε το ποντίκι. Θα αναλάβω εγώ τον έλεγχο." 
    ]);
    
    linkBtn.onmouseenter = () => {
        linkBtn.style.top = `${Math.random() * 80}%`;
        linkBtn.style.left = `${Math.random() * 80}%`;
        playRobotTone(2.5);
    };

    linkBtn.onclick = (e) => {
        e.preventDefault();
        typeMultipleMessages(["EYE-9000: ΕΠΙΚΙΝΔΥΝΗ ΕΝΕΡΓΕΙΑ. Επιστροφή στην ασφάλεια..."]);
        setTimeout(() => { 
            const gans = artworks.map((a,i) => a.type==='gan'?i:-1).filter(i=>i!==-1);
            navigate(gans[Math.floor(Math.random()*gans.length)]);
        }, 1200);
    };
  } else {
    isManipulating = false;
    dialogueBox.style.display = 'none';
  }
}

window.addEventListener('mousedown', () => {
  if (!isInitialized) return;
  const ray = new THREE.Raycaster();
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(planes);
  if (hits.length > 0) navigate(hits[0].object.userData.index);
});

window.addEventListener('keydown', (e) => {
  if (!isInitialized) return;
  if (e.key === 'ArrowRight') navigate(currentIndex + 1);
  if (e.key === 'ArrowLeft') navigate(currentIndex - 1);
  if (e.key === 'Escape') {
    currentIndex = -1; isManipulating = false;
    currentTypingId++; // Kill existing typing
    clearInterval(captionGlitchInterval);
    targetCamPos.set(0, 0, 300); targetCamLook.set(0, 0, 0);
    dialogueBox.style.display = 'none'; linkBtn.style.display = 'none'; caption.style.display = 'none';
  }
});

window.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
});

function animate() {
  requestAnimationFrame(animate);
  const time = Date.now() * 0.001;

  camera.position.lerp(targetCamPos, 0.06);
  currentCamLook.lerp(targetCamLook, 0.08); 
  camera.lookAt(currentCamLook);

  eyeGroup.lookAt(camera.position);
  pupil.position.x = THREE.MathUtils.lerp(pupil.position.x, mouse.x * 6, 0.1);
  pupil.position.y = THREE.MathUtils.lerp(pupil.position.y, mouse.y * 6, 0.1);
  iris.material.emissiveIntensity = 2.0 + Math.sin(time * (isManipulating ? 45 : 4)) * 0.8;

  if (currentIndex === -1) {
    gallery.rotation.y += (mouse.x * 0.1 - gallery.rotation.y) * 0.02;
    gallery.rotation.x += (-mouse.y * 0.1 - gallery.rotation.x) * 0.02;
  } else if (isManipulating) {
    camera.position.x += Math.sin(time * 150) * 0.4;
    camera.position.y += Math.cos(time * 150) * 0.4;
  }
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
